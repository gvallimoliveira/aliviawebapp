<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Cache headers are intentionally NOT forced here.
         Forcing no-cache caused the standalone PWA on iOS to refetch
         index.html on every focus, dropping in-progress flows
         (assessments, payment) back to the home screen. The build hash
         in /version.json + versionChecker handles real updates. -->

    <!-- Nenhum script de rastreamento/mapeamento de sessão é carregado (LGPD:
         usamos apenas armazenamento estritamente necessário). -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Aliv.iA Webapp</title>
    <meta name="description" content="Avaliação musculoesquelética com inteligência artificial. Diagnóstico preliminar e plano de tratamento personalizado em minutos.">
    <meta name="author" content="Aliv.iA" />
    <link rel="canonical" href="https://alivia.app" />

    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alivia.app" />
    <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/4fbc04c1-7208-49b1-aa50-a8456f611f57/id-preview-dac86b22--9a266497-f7cd-4496-81f6-84dc1ea4edfb.lovable.app-1772831872169.png">
    <meta property="og:site_name" content="Aliv.iA" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/4fbc04c1-7208-49b1-aa50-a8456f611f57/id-preview-dac86b22--9a266497-f7cd-4496-81f6-84dc1ea4edfb.lovable.app-1772831872169.png">

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      O manifest NÃO é declarado estaticamente: no iOS ele é lido assim que a tag
      é encontrada, então trocar o href depois (React) já vinha tarde e o atalho
      do Studio era salvo como o app principal. Este script síncrono cria a tag
      já com o manifest correto para a rota. O caminho do Aliv.iA principal
      recebe exatamente o que recebia antes.
    -->
    <script>
      (function () {
        var studio = location.pathname.indexOf("/studio-pro") === 0;
        // Trava: se o atalho do Studio cair em outra rota, volta para o Studio.
        if (!studio && location.search.indexOf("source=studio-pwa") !== -1) {
          location.replace("/studio-pro?source=studio-pwa");
          return;
        }
        var head = document.head;

        function set(tag, attrs) {
          var el = document.createElement(tag);
          for (var k in attrs) el.setAttribute(k, attrs[k]);
          head.appendChild(el);
        }
        set("link", {
          rel: "manifest",
          href: studio ? "/studio-manifest.webmanifest" : "/manifest.webmanifest",
        });
        set("link", {
          rel: "apple-touch-icon",
          href: studio ? "/icons/studio-icon-180.png" : "/pwa-icon-192.png",
        });
        set("meta", { name: "theme-color", content: studio ? "#1D6B5C" : "#3a9e8e" });
        set("meta", {
          name: "apple-mobile-web-app-title",
          content: studio ? "Studio" : "Aliv.iA",
        });
        if (studio) document.title = "Aliv.iA Studio";
      })();
    </script>



    <meta property="og:title" content="Aliv.iA Webapp">

  <meta name="twitter:description" content="Avaliação musculoesquelética com inteligência artificial. Diagnóstico preliminar e plano de tratamento personalizado em minutos.">
</head>
